<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kings of Glory</title>
  </head>
  <body>
    <div id="root">
      <main
        id="startup-fallback"
        style="
          display: grid;
          min-height: 100vh;
          place-items: center;
          background: #101826;
          color: #f4f0df;
          font-family: system-ui, sans-serif;
        "
      >
        <section style="max-width: 32rem; padding: 2rem; text-align: center">
          <h1>Kings of Glory</h1>
          <p>Starting the game client...</p>
          <p style="color: #c8d8e7">
            If this stays visible, refresh the page after running <code>npm run dev</code>.
          </p>
        </section>
      </main>
    </div>
    <div
      id="connection-indicator"
      role="status"
      style="
        position: fixed;
        z-index: 2147483647;
        top: 1rem;
        right: 1rem;
        max-width: 28rem;
        padding: 0.75rem 1rem;
        border: 1px solid #f5d56a;
        border-radius: 0.5rem;
        background: #101826;
        color: #f4f0df;
        font-family: system-ui, sans-serif;
        box-shadow: 0 4px 16px #0008;
      "
    >
      Loading Kings of Glory...
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var fallback = document.getElementById('startup-fallback');
        if (fallback) {
          fallback.innerHTML =
            '<section style="max-width:32rem;padding:2rem;text-align:center"><h1>Kings of Glory could not start</h1><p>Refresh this page after running <code>npm run dev</code>.</p><p style="color:#ffb4a8">' +
            String(event.message || 'Client startup error.') +
            '</p></section>';
        }
        var indicator = document.getElementById('connection-indicator');
        if (indicator)
          indicator.textContent =
            'Client startup error: ' + String(event.message || 'Unknown error.');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
